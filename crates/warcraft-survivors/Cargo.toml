[package]
name = "warcraft-survivors"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Warcraft Survivors: the benilla client booted server-less into a top-down survival mode"

[lints]
workspace = true

[features]
# As the `benilla` launcher: `--no-default-features` is the player build.
default = ["dev"]
dev = ["benilla-app/dev"]

[dependencies]
# `default-features = false`, or `--no-default-features` here still builds benilla-app with `dev`.
benilla-app = { path = "../benilla-app", default-features = false }

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }

[[bin]]
name = "warcraft-survivors"
path = "src/main.rs"
# As the `benilla` launcher: test-building this bin would relink the whole app.
test = false
